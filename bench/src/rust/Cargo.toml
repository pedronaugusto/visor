[package]
name = "visor-comparison"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "visor-comparison"
path = "src/main.rs"

[[bin]]
name = "visor-ops"
path = "src/ops.rs"

[dependencies]
ratatui = { version = "=0.30.1", default-features = false, features = ["crossterm", "layout-cache", "widget-calendar", "unstable-rendered-line-info", "unstable-backend-writer"] }
time = { version = "=0.3.55", default-features = false }
pulldown-cmark = { version = "=0.13.0", default-features = false }
tui-tree-widget = { version = "=0.24.1", default-features = false }
ratatui-textarea = { version = "=0.9.2", default-features = false }
